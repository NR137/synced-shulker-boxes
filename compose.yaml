# Everything runs in one image (docker/Dockerfile); only Docker is needed on the host. Tasks:
#   docker compose run --rm dev ./tasks.sh <task>    (build, test, gametest, smoke, client, all; see ./tasks.sh)
#   docker compose up server                         Fabric dev server (LOADER=neoforge for NeoForge)
name: synced-shulker-boxes

services:
  # Shell, tasks and the VS Code dev container; the server extends it (Compose merges environment, ports and volumes
  # key by key, so a service only adds what it needs).
  dev:
    image: synced-shulker-boxes-dev
    # Checks the image before every start and rebuilds it when docker/Dockerfile or .tool-versions changed (about a
    # second when nothing changed). CI builds it beforehand and sets never.
    pull_policy: ${DEV_IMAGE_POLICY:-build}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Your user's IDs, so files written into the checkout belong to you (CI passes its own).
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
      # A named volume shared by the mod repos by default (see volumes); CI sets this to a folder it caches.
      - ${GRADLE_CACHE:-gradle-cache}:/home/dev/.gradle
    command: bash

  # The dev server of one loader (fabric/runs/server or neoforge/runs/server). Connect with Minecraft to
  # localhost:25565.
  server:
    extends: dev
    command: ["sh", "-c", "./gradlew :${LOADER:-fabric}:runServer"]
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"

volumes:
  # One Gradle cache for all of NR137's mod repos: they download the same Minecraft, loaders and Gradle, and Gradle
  # lets several builds use one cache at the same time.
  gradle-cache:
    name: nr137-mods-gradle-cache
