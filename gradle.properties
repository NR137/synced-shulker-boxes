# Loom and ModDevGradle in one build need more memory than either alone.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Every property used in fabric.mod.json / neoforge.mods.toml must be listed in
# build-logic/src/main/groovy/multiloader-common.gradle (expandProps).

# Project
mod_version=0.9.0
group=de.nr137.syncedshulkerboxes
# java_version comes from .tool-versions (see build.gradle)
archives_base_name=synced-shulker-boxes

# Common
minecraft_version=26.3
minecraft_version_range=[26.3]
# mod_id must match [a-z][a-z0-9_]{1,63} and SyncedShulkerBoxes.MOD_ID
mod_id=synced_shulker_boxes
mod_name=Synced Shulker Boxes
license=MIT
mod_homepage=https://github.com/NR137/synced-shulker-boxes
# Plain Minecraft that common/ compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, check these on https://fabricmc.net/develop
fabric_loader_version=0.20.1
fabric_api_version=0.166.2+26.3

# NeoForge, check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.103

# Mod Menu's API, only to compile the optional settings button (fabric/), see https://modrinth.com/mod/modmenu
modmenu_version=21.0.1

# Test only (game tests): Lithium, which many servers run and which changes how block entities tick and hoppers move
# items; never part of the mod JAR. https://modrinth.com/mod/lithium/versions
lithium_version=mc26.3-0.26.3
